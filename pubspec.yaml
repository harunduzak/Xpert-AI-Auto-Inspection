name: auto_appraisal
description: Offline Auto Appraisal App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  google_mlkit_text_recognition: ^0.15.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  google_fonts: ^6.2.1
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  geolocator: ^12.0.0
  geocoding: ^5.0.0
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"